input {
  # ── Sysmon/ETTX attack datasets ──
  file {
    path           => "/usr/share/logstash/ettx-input/*.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-ettx"
    codec          => "json"
    tags           => ["sysmon"]
  }

  # ── Live CNAS telemetry logs ──
  file {
    path           => "/var/log/ad/ad-telemetry.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-ad"
    codec          => "json"
    tags           => ["ad-cnas", "live"]
  }
  file {
    path           => "/var/log/wsus/wsus-telemetry.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-wsus"
    codec          => "json"
    tags           => ["wsus-cnas", "live"]
  }
  file {
    path           => "/var/log/proxy/proxy-telemetry.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-proxy"
    codec          => "json"
    tags           => ["proxy-cnas", "live"]
  }
  file {
    path           => "/var/log/websrv/websrv-telemetry.json"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb-websrv"
    codec          => "json"
    tags           => ["websrv-cnas", "live"]
  }

  # ── Live TCP events ──
  tcp {
    port  => 5000
    codec => json_lines
    tags  => ["sysmon"]
  }
}

# ════════════════════════════════════════════════════════════════════════════
# FILTER
# Handles all EVTX-sourced providers:
#   • Microsoft-Windows-Sysmon          (EventIDs 1-21)
#   • Microsoft-Windows-Security-Auditing (4624/4625/4648/4656/4662/4663/
#                                          4672/4728/4732/4740/4742/4769/
#                                          4771/4794/4798/4799/4826/1102)
#   • Microsoft-Windows-PowerShell      (4104 script block)
#   • MSSQLSERVER / Application log     (18456 login failure)
#   • NTDS / Directory-Service log      (325/326/327 database ops)
#   • System log                        (7031/7034 service crash)
# ════════════════════════════════════════════════════════════════════════════
filter {
  if "sysmon" in [tags] {

    # ── 1. Timestamp ─────────────────────────────────────────────────────
    if [Event][System][TimeCreated_attributes][SystemTime] {
      date {
        match  => ["[Event][System][TimeCreated_attributes][SystemTime]", "ISO8601"]
        target => "@timestamp"
      }
    }

    # ── 2. Universal System fields → ECS ─────────────────────────────────
    mutate {
      add_field => {
        "[event][code]"     => "%{[Event][System][EventID]}"
        "[host][name]"      => "%{[Event][System][Computer]}"
        "[event][provider]" => "%{[Event][System][Provider_attributes][Name]}"
        "[log][record_id]"  => "%{[Event][System][EventRecordID]}"
        "[event][channel]"  => "%{[Event][System][Channel]}"
      }
    }

    # ── 3. Module / dataset label (by provider) ───────────────────────────
    if [Event][System][Provider_attributes][Name] =~ /Sysmon/ {
      mutate {
        add_field => { "[event][module]" => "sysmon"  "[labels][dataset]" => "sysmon" }
      }
    } else if [Event][System][Provider_attributes][Name] == "Microsoft-Windows-Security-Auditing" {
      mutate {
        add_field => { "[event][module]" => "security" "[labels][dataset]" => "security" }
      }
    } else if [Event][System][Provider_attributes][Name] =~ /PowerShell/ {
      mutate {
        add_field => { "[event][module]" => "powershell" "[labels][dataset]" => "powershell" }
      }
    } else if [Event][System][Channel] == "Application" {
      mutate {
        add_field => { "[event][module]" => "application" "[labels][dataset]" => "application" }
      }
    } else if [Event][System][Channel] == "System" {
      mutate {
        add_field => { "[event][module]" => "system" "[labels][dataset]" => "system" }
      }
    } else {
      mutate {
        add_field => { "[event][module]" => "windows" "[labels][dataset]" => "windows" }
      }
    }

    # ════════════════════════════════════════════════════════════════════
    # SECTION A — SYSMON FIELD MAPPINGS
    # ════════════════════════════════════════════════════════════════════

    # EventID 1 / 10 — Process fields (Image present on both)
    # Also fires for EventID 5 (process terminate), 7 (image load source), etc.
    if [Event][EventData][Image] {
      mutate {
        add_field => {
          "[process][executable]" => "%{[Event][EventData][Image]}"
          "[process][pid]"        => "%{[Event][EventData][ProcessId]}"
          "[process][entity_id]"  => "%{[Event][EventData][ProcessGuid]}"
        }
      }
    }
    if [Event][EventData][CommandLine] {
      mutate {
        add_field => { "[process][command_line]" => "%{[Event][EventData][CommandLine]}" }
      }
    }
    if [Event][EventData][User] {
      mutate {
        add_field => {
          "[user][name]"           => "%{[Event][EventData][User]}"
          "[user][integrity_level]" => "%{[Event][EventData][IntegrityLevel]}"
        }
      }
    }
    if [Event][EventData][Hashes] {
      # Raw value is "SHA1=...,MD5=...,SHA256=...,IMPHASH=..." — keep for now,
      # a post-ingest pipeline can split it if needed.
      mutate {
        add_field => { "[process][hash][all]" => "%{[Event][EventData][Hashes]}" }
      }
    }

    # EventID 1 — parent process
    if [Event][EventData][ParentImage] {
      mutate {
        add_field => {
          "[process][parent][executable]"   => "%{[Event][EventData][ParentImage]}"
          "[process][parent][command_line]" => "%{[Event][EventData][ParentCommandLine]}"
          "[process][parent][pid]"          => "%{[Event][EventData][ParentProcessId]}"
          "[process][parent][entity_id]"    => "%{[Event][EventData][ParentProcessGuid]}"
        }
      }
    }

    # EventID 2 — File Creation Time Changed (timestomp: sysmon_2_11_evasion_timestomp_MACE.evtx)
    if [Event][EventData][PreviousCreationUtcTime] {
      mutate {
        add_field => {
          "[file][path]"                            => "%{[Event][EventData][TargetFilename]}"
          "[file][mtime]"                           => "%{[Event][EventData][CreationUtcTime]}"
          "[sysmon][file][previous_creation_time]"  => "%{[Event][EventData][PreviousCreationUtcTime]}"
        }
      }
    }

    # EventID 3 — Network Connect
    # (powercat_revShell, tunna_iis_rdp_smb_tunneling, Recon_Sysmon_3, etc.)
    if [Event][EventData][SourceIp] {
      mutate {
        add_field => {
          "[source][ip]"        => "%{[Event][EventData][SourceIp]}"
          "[source][port]"      => "%{[Event][EventData][SourcePort]}"
          "[destination][ip]"   => "%{[Event][EventData][DestinationIp]}"
          "[destination][port]" => "%{[Event][EventData][DestinationPort]}"
          "[network][protocol]" => "%{[Event][EventData][Protocol]}"
          "[network][direction]" => "%{[Event][EventData][Initiated]}"
        }
      }
    }

    # EventID 7 — Image / DLL Load
    # (sharprdp_sysmon_7_mstscax.dll, persist_firefox_comhijack)
    if [Event][EventData][ImageLoaded] {
      mutate {
        add_field => {
          "[dll][path]"                    => "%{[Event][EventData][ImageLoaded]}"
          "[dll][name]"                    => "%{[Event][EventData][ImageLoaded]}"
          "[dll][code_signature][signed]"  => "%{[Event][EventData][Signed]}"
          "[dll][code_signature][status]"  => "%{[Event][EventData][SignatureStatus]}"
          "[dll][hash][sha256]"            => "%{[Event][EventData][Hashes]}"
        }
      }
    }

    # EventID 10 — Process Access
    # (Sysmon_10_1_memdump, meterpreter_ps_cmd_process_listing,
    #  CVE-2020-0796, LM_typical_IIS_webshell)
    if [Event][EventData][TargetImage] {
      mutate {
        add_field => {
          "[target][process][executable]"      => "%{[Event][EventData][TargetImage]}"
          "[target][process][pid]"             => "%{[Event][EventData][TargetProcessId]}"
          "[target][process][entity_id]"       => "%{[Event][EventData][TargetProcessGuid]}"
          "[sysmon][process][granted_access]"  => "%{[Event][EventData][GrantedAccess]}"
          "[sysmon][process][call_trace]"      => "%{[Event][EventData][CallTrace]}"
        }
      }
    }

    # EventID 11 — File Create
    # (CA_Mimikatz_Memssp, privesc_unquoted_svc, sysmon_1_11_exec_as_system)
    if [Event][EventData][TargetFilename] and ![Event][EventData][PreviousCreationUtcTime] {
      mutate {
        add_field => { "[file][path]" => "%{[Event][EventData][TargetFilename]}" }
      }
    }

    # EventID 12 / 13 / 14 — Registry
    # (DE_UAC_Disabled, de_PsScriptBlockLogging_disabled,
    #  persistence_startup, evasion_persis_hidden_run_keyvalue,
    #  de_portforward_netsh_rdp, sysmon_local_account_creation)
    if [Event][EventData][TargetObject] {
      mutate {
        add_field => {
          "[registry][path]"               => "%{[Event][EventData][TargetObject]}"
          "[sysmon][registry][event_type]" => "%{[Event][EventData][EventType]}"
        }
      }
    }
    if [Event][EventData][Details] {
      mutate {
        add_field => { "[registry][data][strings]" => "%{[Event][EventData][Details]}" }
      }
    }
    # EventID 12: new/deleted key has NewName for renames
    if [Event][EventData][NewName] {
      mutate {
        add_field => { "[registry][path][new]" => "%{[Event][EventData][NewName]}" }
      }
    }

    # EventID 17 / 18 — Named Pipes
    # (privesc_roguepotato, privesc_seimpersonate, lm_sysmon_18_remshell,
    #  Discovery_sysmon_18_Invoke_UserHunter, enum_shares_target)
    if [Event][EventData][PipeName] {
      mutate {
        add_field => { "[file][name]" => "%{[Event][EventData][PipeName]}" }
      }
    }

    # EventID 20 / 21 — WMI Event Filter / Consumer
    # (wmighost_sysmon_20_21_1)
    if [Event][EventData][EventType] and [Event][EventData][Name] {
      mutate {
        add_field => {
          "[sysmon][wmi][event_type]"  => "%{[Event][EventData][EventType]}"
          "[sysmon][wmi][name]"        => "%{[Event][EventData][Name]}"
          "[sysmon][wmi][query]"       => "%{[Event][EventData][Query]}"
          "[sysmon][wmi][destination]" => "%{[Event][EventData][Destination]}"
        }
      }
    }

    # ════════════════════════════════════════════════════════════════════
    # SECTION B — SECURITY AUDITING FIELD MAPPINGS
    # ════════════════════════════════════════════════════════════════════

    # Subject (acting) user — present on nearly all Security events
    if [Event][EventData][SubjectUserName] {
      mutate {
        add_field => {
          "[user][name]"   => "%{[Event][EventData][SubjectUserName]}"
          "[user][domain]" => "%{[Event][EventData][SubjectDomainName]}"
          "[user][id]"     => "%{[Event][EventData][SubjectUserSid]}"
        }
      }
    }

    # Target user — logon (4624/4625/4648), group change (4728/4732/4742),
    #               account lockout (4740), Kerberos (4769/4771), etc.
    if [Event][EventData][TargetUserName] {
      mutate {
        add_field => {
          "[destination][user][name]"   => "%{[Event][EventData][TargetUserName]}"
          "[destination][user][domain]" => "%{[Event][EventData][TargetDomainName]}"
          "[destination][user][id]"     => "%{[Event][EventData][TargetSid]}"
        }
      }
    }

    # Source network info — logon events, Kerberos
    if [Event][EventData][IpAddress] {
      mutate {
        add_field => {
          "[source][ip]"   => "%{[Event][EventData][IpAddress]}"
          "[source][port]" => "%{[Event][EventData][IpPort]}"
        }
      }
    }
    if [Event][EventData][WorkstationName] {
      mutate {
        add_field => { "[source][domain]" => "%{[Event][EventData][WorkstationName]}" }
      }
    }

    # Object / file / process handle — 4656, 4662, 4663 (lsass access, DCSync)
    if [Event][EventData][ObjectName] {
      mutate {
        add_field => {
          "[file][path]"                => "%{[Event][EventData][ObjectName]}"
          "[winlog][event_data][ObjectType]"   => "%{[Event][EventData][ObjectType]}"
          "[winlog][event_data][HandleId]"     => "%{[Event][EventData][HandleId]}"
          "[winlog][event_data][AccessList]"   => "%{[Event][EventData][AccessList]}"
          "[winlog][event_data][AccessMask]"   => "%{[Event][EventData][AccessMask]}"
        }
      }
    }

    # Process that performed the action (Security events use ProcessName)
    if [Event][EventData][ProcessName] and ![Event][EventData][Image] {
      mutate {
        add_field => { "[process][executable]" => "%{[Event][EventData][ProcessName]}" }
      }
    }

    # Logon type (4624/4625) — 2=interactive, 3=network, 10=remote, etc.
    if [Event][EventData][LogonType] {
      mutate {
        add_field => { "[winlog][logon][type]" => "%{[Event][EventData][LogonType]}" }
      }
    }

    # Kerberos 4769 / 4771 fields
    if [Event][EventData][ServiceName] {
      mutate {
        add_field => { "[service][name]" => "%{[Event][EventData][ServiceName]}" }
      }
    }
    if [Event][EventData][TicketEncryptionType] {
      mutate {
        add_field => {
          "[winlog][event_data][TicketEncryptionType]" => "%{[Event][EventData][TicketEncryptionType]}"
          "[winlog][event_data][TicketOptions]"        => "%{[Event][EventData][TicketOptions]}"
        }
      }
    }
    if [Event][EventData][FailureCode] {
      mutate {
        add_field => { "[winlog][failure][status]" => "%{[Event][EventData][FailureCode]}" }
      }
    }
    if [Event][EventData][Status] {
      mutate {
        add_field => { "[winlog][logon][failure][status]" => "%{[Event][EventData][Status]}" }
      }
    }

    # 4742 — Computer account changed (DCShadow: persistence_security_dcshadow_4742)
    if [Event][EventData][SamAccountName] {
      mutate {
        add_field => { "[destination][user][name]" => "%{[Event][EventData][SamAccountName]}" }
      }
    }

    # 4798 / 4799 — Group enumeration (discovery_local_user_or_group_windows_security)
    if [Event][EventData][GroupName] {
      mutate {
        add_field => { "[group][name]" => "%{[Event][EventData][GroupName]}" }
      }
    }
    if [Event][EventData][MemberName] {
      mutate {
        add_field => { "[winlog][event_data][MemberName]" => "%{[Event][EventData][MemberName]}" }
      }
    }

    # 4826 — Boot Configuration Data changed (DE_KernelDebug_and_TestSigning_ON_Security)
    if [Event][EventData][SubjectLogonId] {
      mutate {
        add_field => { "[winlog][logon][id]" => "%{[Event][EventData][SubjectLogonId]}" }
      }
    }

    # ════════════════════════════════════════════════════════════════════
    # SECTION C — POWERSHELL 4104 SCRIPT BLOCK LOGGING
    # (Powershell_4104_MiniDumpWriteDump_Lsass.evtx)
    # ════════════════════════════════════════════════════════════════════
    if [Event][EventData][ScriptBlockText] {
      mutate {
        add_field => {
          "[powershell][script_block][text]" => "%{[Event][EventData][ScriptBlockText]}"
          "[powershell][script_block][id]"   => "%{[Event][EventData][ScriptBlockId]}"
          "[powershell][file][path]"         => "%{[Event][EventData][Path]}"
        }
      }
    }

    # ════════════════════════════════════════════════════════════════════
    # SECTION D — APPLICATION LOG (MSSQL 18456 + NTDS 325/326/327)
    # ════════════════════════════════════════════════════════════════════

    # MSSQL 18456 — Login failed (MSSQL_multiple_failed_logon_EventID_18456.evtx)
    if [Event][System][EventID] == 18456 or [Event][System][EventID] == "18456" {
      if [Event][EventData][Data] {
        mutate {
          add_field => {
            "[winlog][event_data][MssqlLoginFailureData]" => "%{[Event][EventData][Data]}"
          }
        }
      }
    }

    # NTDS 325 / 326 / 327 — database internal ops (DC_applog_ntdsutil_dfir)
    if [Event][UserData] {
      mutate {
        add_field => { "[winlog][user_data]" => "%{[Event][UserData]}" }
      }
    }

    # ════════════════════════════════════════════════════════════════════
    # SECTION E — EVENTID CLASSIFICATION (category + type/outcome)
    # ════════════════════════════════════════════════════════════════════

    # ── Sysmon ──────────────────────────────────────────────────────────
    if [event][code] == "1" {
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "start" } }
    } else if [event][code] == "2" {
      # Timestomp: file creation time changed
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "change" } }
    } else if [event][code] == "3" {
      mutate { add_field => { "[event][category]" => "network"  "[event][type]" => "connection" } }
    } else if [event][code] == "5" {
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "end" } }
    } else if [event][code] == "6" {
      # Driver load
      mutate { add_field => { "[event][category]" => "driver"   "[event][type]" => "start" } }
    } else if [event][code] == "7" {
      # Image / DLL load
      mutate { add_field => { "[event][category]" => "library"  "[event][type]" => "load" } }
    } else if [event][code] == "8" {
      # CreateRemoteThread
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "change" } }
    } else if [event][code] == "9" {
      # RawAccessRead
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "access" } }
    } else if [event][code] == "10" {
      # Process access (memory dump, credential access)
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "access" } }
    } else if [event][code] == "11" {
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "creation" } }
    } else if [event][code] == "12" {
      # Registry add/delete
      mutate { add_field => { "[event][category]" => "registry" "[event][type]" => "change" } }
    } else if [event][code] == "13" {
      # Registry value set
      mutate { add_field => { "[event][category]" => "registry" "[event][type]" => "change" } }
    } else if [event][code] == "14" {
      # Registry key/value rename
      mutate { add_field => { "[event][category]" => "registry" "[event][type]" => "change" } }
    } else if [event][code] == "15" {
      # FileCreateStreamHash (ADS)
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "creation" } }
    } else if [event][code] == "17" {
      # Pipe Created
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "creation" } }
    } else if [event][code] == "18" {
      # Pipe Connected
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "access" } }
    } else if [event][code] == "19" {
      # WmiEvent Filter
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "change" } }
    } else if [event][code] == "20" {
      # WmiEvent Consumer
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "change" } }
    } else if [event][code] == "21" {
      # WmiEvent Consumer-to-Filter binding
      mutate { add_field => { "[event][category]" => "process"  "[event][type]" => "change" } }
    } else if [event][code] == "22" {
      # DNS query
      mutate { add_field => { "[event][category]" => "network"  "[event][type]" => "info" } }
    } else if [event][code] == "23" {
      # File Delete archived
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "deletion" } }
    } else if [event][code] == "26" {
      # File Delete logged
      mutate { add_field => { "[event][category]" => "file"     "[event][type]" => "deletion" } }

    # ── Security Auditing ────────────────────────────────────────────────
    } else if [event][code] == "4624" {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "success" } }
    } else if [event][code] == "4625" {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
    } else if [event][code] == "4648" {
      # Logon with explicit credentials (token duplication, pass-the-hash pivot)
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "unknown" } }
    } else if [event][code] == "4656" {
      # Handle to object requested (lsass handle)
      mutate { add_field => { "[event][category]" => "file"  "[event][type]" => "access" } }
    } else if [event][code] == "4662" {
      # Operation performed on object (DCSync — replication)
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "info" } }
    } else if [event][code] == "4663" {
      # Object access (lsass read)
      mutate { add_field => { "[event][category]" => "file"  "[event][type]" => "access" } }
    } else if [event][code] == "4672" {
      # Special privileges assigned (SE_DEBUG, SE_IMPERSONATE etc.)
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "info" } }
    } else if [event][code] == "4728" {
      # Member added to global security group
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "change" } }
    } else if [event][code] == "4732" {
      # Member added to local security group (Network_Service_Guest_added_to_admins)
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "change" } }
    } else if [event][code] == "4740" {
      # Account lockout
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
    } else if [event][code] == "4742" {
      # Computer account changed (DCShadow)
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "change" } }
    } else if [event][code] == "4769" {
      # Kerberos TGS request (Kerberoasting target)
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "unknown" } }
    } else if [event][code] == "4771" {
      # Kerberos pre-auth failed (password spray)
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
    } else if [event][code] == "4794" {
      # DSRM password set attempt
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "change" } }
    } else if [event][code] == "4798" {
      # User local group membership enumerated
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "info" } }
    } else if [event][code] == "4799" {
      # Security-enabled local group membership enumerated
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "info" } }
    } else if [event][code] == "4826" {
      # Boot Configuration Data changed (kernel debug / test signing)
      mutate { add_field => { "[event][category]" => "configuration" "[event][type]" => "change" } }
    } else if [event][code] == "1102" or [event][code] == "104" {
      # Audit log cleared
      mutate { add_field => { "[event][category]" => "iam"   "[event][type]" => "deletion" } }

    # ── PowerShell ───────────────────────────────────────────────────────
    } else if [event][code] == "4104" {
      mutate { add_field => { "[event][category]" => "process" "[event][type]" => "info" } }
    } else if [event][code] == "4103" {
      mutate { add_field => { "[event][category]" => "process" "[event][type]" => "info" } }

    # ── MSSQL (Application log) ──────────────────────────────────────────
    } else if [event][code] == "18456" {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }

    # ── NTDS / Directory Service (Application log) ───────────────────────
    } else if [event][code] == "325" or [event][code] == "326" or [event][code] == "327" {
      mutate { add_field => { "[event][category]" => "database" "[event][type]" => "info" } }

    # ── System log (service crashes) ─────────────────────────────────────
    } else if [event][code] == "7034" or [event][code] == "7031" {
      # Service terminated unexpectedly (DE_EventLog_Service_Crashed)
      mutate { add_field => { "[event][category]" => "process" "[event][type]" => "end" } }
    }

    # ── 6. Clean up raw nested Event object ──────────────────────────────
    mutate {
      remove_field => ["Event", "Event_attributes", "host", "message"]
    }
  }
}

