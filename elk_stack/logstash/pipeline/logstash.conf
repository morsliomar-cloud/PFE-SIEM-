input {
  syslog {
    port => 514
    host => "0.0.0.0"
    type => "syslog"
  }
}

filter {
  # Basic syslog parsing
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
    }
  }

  date {
    match  => [ "syslog_timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
    target => "@timestamp"
  }

  if [priority] {
    ruby {
      code => "
        priority = event.get('priority').to_i
        event.set('facility', priority >> 3)
        event.set('severity', priority & 7)
      "
    }
  }

  mutate {
    add_field => {
      "received_at" => "%{@timestamp}"
      "source_type" => "syslog"
    }
    copy    => { "syslog_message" => "original_message" }
    replace => { "message" => "%{syslog_message}" }
    remove_field => [ "syslog_message", "syslog_timestamp" ]
  }
}

output {
  # Route auth-monitor messages to logs-system.auth-default
  if [syslog_program] == "auth-monitor" {
    elasticsearch {
      hosts => ["http://es01:9200"]
      user => "elastic"
      password => "changeme"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "system.auth"
      data_stream_namespace => "default"
    }
  } 
  # Route all other syslog messages to logs-system.syslog-default
  else {
    elasticsearch {
      hosts => ["http://es01:9200"]
      user => "elastic"
      password => "changeme"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "system.syslog"
      data_stream_namespace => "default"
    }
  }
}