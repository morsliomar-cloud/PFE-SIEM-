input {
  syslog {
    port => 514
    host => "0.0.0.0"
    type => "syslog"
  }
}

filter {
  # The syslog input already parsed: host, timestamp, facility, severity
  # We only need to extract program name and pid from the message body

  grok {
    match => {
      "message" => "^(?:%{DATA:syslog_program}(?:\\[%{POSINT:syslog_pid}\\])?:\\s)?%{GREEDYDATA:syslog_message}"
    }
    overwrite => [ "message" ]
    tag_on_failure => ["_grokparsefailure"]
  }

  # Replace message with the clean body only if grok succeeded
  if [syslog_message] {
    mutate {
      replace => { "message" => "%{syslog_message}" }
    }
  }

  mutate {
    # ECS field renames
    rename => {
      "logsource"        => "[host][name]"
      "[host][hostname]" => "[host][name]"
      "syslog_program" => "[process][name]"
      "syslog_pid"     => "[process][pid]"
    }
    add_field => {
      "received_at"       => "%{@timestamp}"
      "source_type"       => "syslog"
      "[event][kind]"     => "event"
      "[event][category]" => "network"
      "[ecs][version]"    => "8.11.0"
    }
    remove_field => [ "syslog_message", "syslog_timestamp" ]
  }
}

output {
  if [@metadata][input_codec_tag] == "auth" or [process][name] == "sshd" or [process][name] == "sudo" or [process][name] == "su" {
    elasticsearch {
      hosts    => ["https://es01:9200"]
      user     => "logstash_writer"
      password => "${LOGSTASH_PASSWORD}"
      data_stream           => true
      data_stream_type      => "logs"
      data_stream_dataset   => "system.auth"
      data_stream_namespace => "default"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/elastic-ca.pem"]
    }
  } else {
    elasticsearch {
      hosts    => ["https://es01:9200"]
      user     => "logstash_writer"
      password => "${LOGSTASH_PASSWORD}"
      data_stream           => true
      data_stream_type      => "logs"
      data_stream_dataset   => "system.syslog"
      data_stream_namespace => "default"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/elastic-ca.pem"]
    }
  }
}