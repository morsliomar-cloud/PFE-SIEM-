# =============================================================================
# Logstash Pipeline â€” CICIDS 2017 PortScan Dataset
# File:    elk-config/logstash/cicids.conf
# Index:   cicids-YYYY.MM.dd
# Dataset: Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv
# =============================================================================

input {
  file {
    path          => "/usr/share/logstash/datasets/cicids2017/Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv"
    start_position => "beginning"
    sincedb_path  => "/usr/share/logstash/data/sincedb-cicids-portscan"
    tags          => ["cicids2017", "portscan"]
    mode          => "read"       # read-once mode â€” file won't be re-read after EOF
  }
}

filter {

  # â”€â”€ Step 1: Skip the header row â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  if [message] =~ /(?i)^flow id/ {
    drop { }
  }

  # â”€â”€ Step 2: Skip blank lines â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  if [message] =~ /^\s*$/ {
    drop { }
  }

  # â”€â”€ Step 3: Parse all 85 CSV columns â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  csv {
    separator => ","
    columns   => [
      "flow_id",
      "src_ip",
      "src_port",
      "dst_ip",
      "dst_port",
      "protocol",
      "timestamp_raw",
      "flow_duration",
      "total_fwd_packets",
      "total_bwd_packets",
      "total_len_fwd",
      "total_len_bwd",
      "fwd_pkt_len_max",
      "fwd_pkt_len_min",
      "fwd_pkt_len_mean",
      "fwd_pkt_len_std",
      "bwd_pkt_len_max",
      "bwd_pkt_len_min",
      "bwd_pkt_len_mean",
      "bwd_pkt_len_std",
      "flow_bytes_per_s",
      "flow_pkts_per_s",
      "flow_iat_mean",
      "flow_iat_std",
      "flow_iat_max",
      "flow_iat_min",
      "fwd_iat_total",
      "fwd_iat_mean",
      "fwd_iat_std",
      "fwd_iat_max",
      "fwd_iat_min",
      "bwd_iat_total",
      "bwd_iat_mean",
      "bwd_iat_std",
      "bwd_iat_max",
      "bwd_iat_min",
      "fwd_psh_flags",
      "bwd_psh_flags",
      "fwd_urg_flags",
      "bwd_urg_flags",
      "fwd_header_len",
      "bwd_header_len",
      "fwd_pkts_per_s",
      "bwd_pkts_per_s",
      "pkt_len_min",
      "pkt_len_max",
      "pkt_len_mean",
      "pkt_len_std",
      "pkt_len_variance",
      "fin_flag_count",
      "syn_flag_count",
      "rst_flag_count",
      "psh_flag_count",
      "ack_flag_count",
      "urg_flag_count",
      "cwe_flag_count",
      "ece_flag_count",
      "down_up_ratio",
      "avg_pkt_size",
      "avg_fwd_segment",
      "avg_bwd_segment",
      "fwd_header_len2",
      "fwd_avg_bytes_bulk",
      "fwd_avg_pkts_bulk",
      "fwd_avg_bulk_rate",
      "bwd_avg_bytes_bulk",
      "bwd_avg_pkts_bulk",
      "bwd_avg_bulk_rate",
      "subflow_fwd_pkts",
      "subflow_fwd_bytes",
      "subflow_bwd_pkts",
      "subflow_bwd_bytes",
      "init_win_fwd",
      "init_win_bwd",
      "act_data_pkt_fwd",
      "min_seg_fwd",
      "active_mean",
      "active_std",
      "active_max",
      "active_min",
      "idle_mean",
      "idle_std",
      "idle_max",
      "idle_min",
      "label"
    ]
  }

  # â”€â”€ Step 4: Parse the original timestamp from the CSV â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # CICIDS timestamp format: "5/7/2017 14:02:52"  (M/D/YYYY H:MM:SS)
  if [timestamp_raw] and [timestamp_raw] != "" {
    date {
      match       => ["timestamp_raw", "M/d/yyyy H:mm:ss", "M/d/yyyy HH:mm:ss"]
      target      => "@timestamp"
      timezone    => "America/Halifax"   # CIC lab timezone
      remove_field => ["timestamp_raw"]
    }
  }

  # â”€â”€ Step 5: ECS field mapping â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mutate {
    rename => {
      "src_ip"           => "[source][ip]"
      "src_port"         => "[source][port]"
      "dst_ip"           => "[destination][ip]"
      "dst_port"         => "[destination][port]"
      "protocol"         => "[network][transport]"
      "flow_bytes_per_s" => "[network][bytes]"
      "flow_pkts_per_s"  => "[network][packets]"
      "flow_duration"    => "[event][duration]"
      "label"            => "_raw_label"
    }

    # ECS required fields
    add_field => {
      "[event][category]"  => "network"
      "[event][module]"    => "cicids2017"
      "[event][dataset]"   => "cicids2017.portscan"
      "[labels][dataset]"  => "network-cnas"
      "[labels][source]"   => "cicids2017"
      "[host][name]"       => "NETWORK-CNAS-KOLEA"
    }
  }

  # â”€â”€ Step 6: Map label â†’ ECS outcome + MITRE ATT&CK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  if [_raw_label] == "BENIGN" {
    mutate {
      add_field => {
        "[event][outcome]" => "success"
        "[event][type]"    => "connection"
      }
    }
  } else if [_raw_label] =~ /PortScan/ or [_raw_label] == "PortScan" {
    mutate {
      add_field => {
        "[event][outcome]"             => "failure"
        "[event][type]"                => "denied"
        "[event][code]"                => "5010"
        "[threat][tactic][id]"         => "TA0007"
        "[threat][tactic][name]"       => "Discovery"
        "[threat][tactic][reference]"  => "https://attack.mitre.org/tactics/TA0007/"
        "[threat][technique][id]"      => "T1046"
        "[threat][technique][name]"    => "Network Service Discovery"
        "[threat][technique][reference]" => "https://attack.mitre.org/techniques/T1046/"
      }
    }
  } else {
    # Any other attack label
    mutate {
      add_field => {
        "[event][outcome]"       => "failure"
        "[event][type]"          => "denied"
        "[threat][tactic][name]" => "%{_raw_label}"
      }
    }
  }

  mutate { remove_field => ["_raw_label"] }

  # â”€â”€ Step 7: Convert numeric fields to proper types â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mutate {
    convert => {
      "[source][port]"        => "integer"
      "[destination][port]"   => "integer"
      "[network][bytes]"      => "float"
      "[network][packets]"    => "float"
      "[event][duration]"     => "integer"
      "total_fwd_packets"     => "integer"
      "total_bwd_packets"     => "integer"
      "syn_flag_count"        => "integer"
      "fin_flag_count"        => "integer"
      "rst_flag_count"        => "integer"
      "ack_flag_count"        => "integer"
      "psh_flag_count"        => "integer"
      "pkt_len_mean"          => "float"
      "pkt_len_max"           => "integer"
      "pkt_len_min"           => "integer"
      "avg_pkt_size"          => "float"
      "init_win_fwd"          => "integer"
      "init_win_bwd"          => "integer"
    }
  }

  # â”€â”€ Step 8: Clean up Logstash-added metadata fields â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  mutate {
    remove_field => [
      "message", "host", "path",
      "flow_id",            # internal CICIDS flow ID, not useful in SIEM
      "fwd_header_len2"     # duplicate of fwd_header_len
    ]
  }

}

output {
  if "cicids2017" in [tags] {
    elasticsearch {
      hosts              => ["http://es01:9200"]
      user               => "elastic"
      password           => "changeme"
      index              => "cicids-%{+YYYY.MM.dd}"
      manage_template    => false
    }
  }

  # â”€â”€ Debug: uncomment to print events to Logstash stdout during testing â”€â”€â”€â”€â”€â”€â”€
  # stdout { codec => rubydebug }
}