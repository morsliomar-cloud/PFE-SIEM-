# elk_stack/fleet-server/elastic-agent.yml
outputs:
  default:
    type: elasticsearch
    hosts:
      - https://es01:9200
    service_token: "${FLEET_SERVER_SERVICE_TOKEN}"

inputs:
  - type: fleet-server
    policy:
      id: fleet-server-policy
    server:
      host: 0.0.0.0
      port: 8220

fleet:
  enabled: true
  url: "https://fleet-server:8220"
  kibana:
    hosts:
      - https://kibana01:5601
    setup: true