services:

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.1.3
    container_name: es01
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=certs/es01.crt
      - xpack.security.http.ssl.key=certs/es01.key
      - xpack.security.http.ssl.certificate_authorities=certs/elastic-ca.pem
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.certificate=certs/es01.crt
      - xpack.security.transport.ssl.key=certs/es01.key
      - xpack.security.transport.ssl.certificate_authorities=certs/elastic-ca.pem
      - xpack.security.transport.ssl.verification_mode=certificate
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - "0.0.0.0:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./snapshots:/usr/share/elasticsearch/snapshots
      - ./certs:/usr/share/elasticsearch/config/certs
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -q status"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  kibana01:
    image: docker.elastic.co/kibana/kibana-wolfi:9.1.3
    container_name: kibana01
    restart: unless-stopped
    ports:
      - "0.0.0.0:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/elastic-ca.pem
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=certificate
      - ELASTICSEARCH_REQUESTTIMEOUT=60000
      - XPACK_FLEET_ENABLED=true
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=["https://es01:9200"]
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["https://fleet-server:8220"]
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACK_ENCRYPTED_SAVED_OBJECTS_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${XPACK_REPORTING_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${XPACK_SECURITY_KEY}
      - 'XPACK_FLEET_OUTPUTS=[{"id": "fleet-default-output", "name": "default", "is_default": true, "is_default_monitoring": true, "type": "elasticsearch", "hosts": ["https://es01:9200"], "ca_trusted_fingerprint": "1DE4EDE8113BB77E41DA12D8774A17AF2A11D7DE72040F0210CA657DC38043AB"}]'
    volumes:
      - ./certs:/usr/share/kibana/config/certs
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - backend-net

  logstash01:
    image: docker.elastic.co/logstash/logstash-wolfi:9.1.3
    container_name: logstash01
    ports:
      - "514:514/tcp"
      - "514:514/udp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./certs:/usr/share/logstash/config/certs:ro
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - backend-net

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: fleet-server
    hostname: fleet-server
    restart: unless-stopped
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://es01:9200
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVICE_TOKEN}
      - FLEET_SERVER_ELASTICSEARCH_CA=/usr/share/elastic-agent/certs/elastic-ca.pem
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_CERT=/usr/share/elastic-agent/certs/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/usr/share/elastic-agent/certs/fleet-server.key
      - KIBANA_HOST=http://kibana01:5601
      - KIBANA_FLEET_SETUP=1
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/usr/share/elastic-agent/certs/elastic-ca.pem
    volumes:
      - ./certs:/usr/share/elastic-agent/certs:ro
      - fleet-server-data:/usr/share/elastic-agent/state/data
      - fleet-server-logs:/var/log/elastic-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 4.4 FIX: replaced /:/hostfs:ro with specific paths only
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /etc/hostname:/hostfs/etc/hostname:ro
      - /etc/os-release:/hostfs/etc/os-release:ro
      - ./certs/elastic-ca.pem:/etc/ssl/certs/elastic-ca.pem:ro
    ports:
      - "0.0.0.0:8220:8220"
    depends_on:
      es01:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8220/api/status | grep -q HEALTHY || exit 1"]
      start_period: 90s
      interval: 10s
      retries: 15
    networks:
      - frontend-net
      - backend-net

  agent-proxy:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: agent-proxy
    hostname: agent-proxy
    restart: unless-stopped
    # 4.3 FIX: removed pid:host, SYS_PTRACE, SYS_ADMIN, SYS_MODULE, SYS_RESOURCE
    # 4.3 FIX: added cap_drop:ALL and no-new-privileges (deny-first posture)
    cap_add:
      - NET_ADMIN        # network interface management
      - NET_RAW          # raw packet access for network monitoring
      - DAC_READ_SEARCH  # read log files regardless of ownership
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=https://fleet-server:8220
      - FLEET_ENROLLMENT_TOKEN=${PROXY_ENROLLMENT_TOKEN}
      - SSL_CERTIFICATE_AUTHORITIES=/usr/share/elastic-agent/certs/elastic-ca.pem
      - ELASTIC_NETINFO=false
    volumes:
      - proxy-logs:/var/log/squid:ro
      # 4.4 NOTE: /proc and cgroup kept — required by System integration policy
      - /proc:/hostproc:ro
      - /sys/fs/cgroup:/hostcgroup:ro
      - ./certs:/usr/share/elastic-agent/certs:ro
      - ./certs/elastic-ca.pem:/etc/ssl/certs/elastic-ca.pem:ro
    depends_on:
      fleet-server:
        condition: service_healthy
    networks:
      - frontend-net

  agent-websrv:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: agent-websrv
    hostname: agent-websrv
    restart: unless-stopped
    # 4.3 FIX: removed pid:host, SYS_PTRACE, SYS_ADMIN, SYS_MODULE, SYS_RESOURCE
    # 4.3 FIX: added cap_drop:ALL and no-new-privileges (deny-first posture)
    cap_add:
      - NET_ADMIN        # network interface management
      - NET_RAW          # raw packet access for network monitoring
      - DAC_READ_SEARCH  # read log files regardless of ownership
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=https://fleet-server:8220
      - FLEET_ENROLLMENT_TOKEN=${WEBSRV_ENROLLMENT_TOKEN}
      - SSL_CERTIFICATE_AUTHORITIES=/usr/share/elastic-agent/certs/elastic-ca.pem
      - ELASTIC_NETINFO=false
    volumes:
      - websrv-logs:/var/log/nginx:ro
      # 4.4 NOTE: /proc and cgroup kept — required by System integration policy
      - /proc:/hostproc:ro
      - /sys/fs/cgroup:/hostcgroup:ro
      - ./certs:/usr/share/elastic-agent/certs:ro
      - ./certs/elastic-ca.pem:/etc/ssl/certs/elastic-ca.pem:ro
    depends_on:
      fleet-server:
        condition: service_healthy
    networks:
      - frontend-net

volumes:
  esdata:
    driver: local
  proxy-logs:
    driver: local
  websrv-logs:
    driver: local
  certs:
  kibanadata:
  fleet-server-data:
  fleet-server-logs:
  # NOTE: fleet-server-state removed — was declared but never used

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge