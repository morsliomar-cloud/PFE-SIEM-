version: "3.8"

services:

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.1.3
    container_name: es01
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=changeme
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "0.0.0.0:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:changeme http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana01:
    image: docker.elastic.co/kibana/kibana-wolfi:9.1.3
    container_name: kibana01
    ports:
      - "0.0.0.0:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=changeme
      - XPACK_FLEET_ENABLED=true
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=["http://es01:9200"]
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["http://fleet-server:8220"]
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7f3c1d2e4b5a6f7c8d9e0a1b2c3d4e5
      - XPACK_REPORTING_ENCRYPTIONKEY=b8e4d1c2f3a7b6c5d4e3f2a1b0c9d8e7
      - XPACK_SECURITY_ENCRYPTIONKEY=c9f5e2d3a4b7c6d5e4f3a2b1c0d9e8f7
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - elastic-net

  logstash01:
    image: docker.elastic.co/logstash/logstash-wolfi:9.1.3
    container_name: logstash01
    ports:
      - "514:514/tcp"
      - "514:514/udp"
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/ettx-input:/usr/share/logstash/ettx-input
      - ./logstash/datasets:/usr/share/logstash/datasets:ro
      - proxy-logs:/var/log/proxy:ro
      - websrv-logs:/var/log/websrv:ro
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - elastic-net

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: fleet-server
    hostname: fleet-server
    restart: unless-stopped
    user: root
    privileged: true
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
      - DAC_READ_SEARCH
      - SYS_RESOURCE
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://es01:9200
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVICE_TOKEN}
      - FLEET_SERVER_INSECURE_HTTP=1
      - FLEET_SERVER_ELASTICSEARCH_INSECURE=1
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - KIBANA_HOST=http://kibana01:5601
      - KIBANA_FLEET_SETUP=1
    volumes:
      - fleet-server-state:/usr/share/elastic-agent/state
    ports:
      - "0.0.0.0:8220:8220"
    depends_on:
      es01:
        condition: service_healthy
    healthcheck:                                          # ← ADD: so agents wait for fleet-server
      test: ["CMD-SHELL", "curl -s http://localhost:8220/api/status > /dev/null 2>&1"]
      start_period: 120s   # ← don't even start checking until 120s have passed
      interval: 10s
      retries: 15
    networks:
      - elastic-net

  agent-proxy:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: agent-proxy
    hostname: agent-proxy
    restart: unless-stopped
    user: root
    privileged: true
  # pid: host   ← REMOVED, causes Tini PID 1 warning
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
      - DAC_READ_SEARCH
      - SYS_RESOURCE
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=http://fleet-server:8220
      - FLEET_ENROLLMENT_TOKEN=${PROXY_ENROLLMENT_TOKEN}
      - FLEET_INSECURE=true
    volumes:
      - proxy-logs:/var/log/squid:ro
    depends_on:
      fleet-server:
        condition: service_healthy    # ← waits for fleet-server to be ready
    networks:
      - elastic-net

  agent-websrv:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: agent-websrv
    hostname: agent-websrv
    restart: unless-stopped
    user: root
    privileged: true
  # pid: host   ← REMOVED
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
      - DAC_READ_SEARCH
      - SYS_RESOURCE
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=http://fleet-server:8220
      - FLEET_ENROLLMENT_TOKEN=${WEBSRV_ENROLLMENT_TOKEN}
      - FLEET_INSECURE=true
    volumes:
      - websrv-logs:/var/log/nginx:ro
    depends_on:
      fleet-server:
        condition: service_healthy    # ← waits for fleet-server to be ready
    networks:
      - elastic-net

volumes:
  esdata:
    driver: local
  fleet-server-state:
    driver: local
  proxy-logs:
    driver: local
  websrv-logs:
    driver: local

networks:
  elastic-net:
    driver: bridge
