# ─── Ports ────────────────────────────────────────────────────────────────────
http_port 3128

# ─── ACL Definitions ──────────────────────────────────────────────────────────
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 100.64.0.0/10    # RFC 6598 CGN
acl localnet src 169.254.0.0/16   # RFC 3927 link-local
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl Safe_ports port 1025-65535
acl CONNECT    method CONNECT

# ─── Access Control ───────────────────────────────────────────────────────────
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost manager
http_access deny  manager

http_access deny to_localhost
http_access deny to_linklocal

http_access allow localnet
http_access allow localhost
http_access deny  all

# ─── Cache (disabled — proxy-only mode) ───────────────────────────────────────
# No cache_dir directive = memory-only (Squid 3.1+), avoids -z init loop
cache deny all

# ─── Privacy / Security Headers ───────────────────────────────────────────────
httpd_suppress_version_string on
via off
forwarded_for delete
follow_x_forwarded_for deny all
request_header_access X-Forwarded-For deny all
reply_header_access X-Cache        deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access Server         deny all

# ─── Logging ──────────────────────────────────────────────────────────────────
logformat custom %{%Y-%m-%d %H:%M:%S}tl %>a %Ss/%03>Hs "%rm %ru HTTP/%rv" %mt %<st %tr "%{User-Agent}>h"

access_log stdio:/var/log/squid/access.log custom
cache_log  /var/log/squid/cache.log

# ─── Process ──────────────────────────────────────────────────────────────────
pid_filename /run/squid.pid
coredump_dir /var/spool/squid

# Suppress the Via RFC warning (intentional: privacy proxy)
httpd_suppress_version_string on
# Already set, but also suppress startup warnings:
# via off is intentional — silence the nag