user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log combined;
    sendfile        on;
    keepalive_timeout  65;

    # Primary web server
    server {
        listen 80;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.18.0.0/16;   # only elastic-net subnet
            deny all;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    # Secondary / metrics-only port (kept for backward compat)
    server {
        listen 8080;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}